name: AI Video Studio APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q AI-Video-Studio-APK-Project.zip -d project

      - name: Install project dependencies
        working-directory: project
        run: npm install

      - name: Add Android platform
        working-directory: project
        run: npx cap add android

      - name: Sync Android project
        working-directory: project
        run: npx cap sync android

      - name: Build APK
        working-directory: project/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Studio-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          
